<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trailvault | Agent audit journal</title><link rel="stylesheet" href="/style.css"></head><body><main><header><p class="eyebrow">AGENT OPERATIONS / AUDIT JOURNAL</p><h1>Trailvault</h1><p>Small actions. A verifiable trail.</p></header><section class="toolbar"><label>API token <input id="token" type="password" autocomplete="off" placeholder="Kept only in this tab's memory"></label><button id="connect">Load journal</button><button id="verify">Verify chain</button></section><p id="status" role="status">Enter your server token to view events.</p><section><h2>Record an action</h2><form id="event"><label>Actor <input name="actor" required maxlength="120" placeholder="research-agent"></label><label>Action <input name="action" required maxlength="120" placeholder="document.read"></label><label>Outcome <select name="outcome"><option>ok</option><option>blocked</option><option>failed</option></select></label><label>Details <textarea name="details" maxlength="8192" placeholder="No secrets or raw prompts"></textarea></label><button>Append event</button></form></section><section><h2>Events, oldest first</h2><div id="events"></div><button id="more">Load more</button></section><footer>Append-only journal. Hash chains detect changes, not a malicious server owner.</footer></main><script src="/app.js"></script></body></html>
